<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15121e" />
  <title>WikiDéfi – Duel chronologique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="script.js?v=3" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="arcade-header">
      <div class="brand">
        <p class="brand-label">Duel chronologique</p>
        <h1>WIKI<span>DÉFI</span></h1>
      </div>

      <div class="scoreboard" role="group" aria-label="Tableau des scores">
        <div class="stat-box">
          <span class="stat-label">Score</span>
          <span id="score-value" class="stat-num">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Série</span>
          <span id="streak-value" class="stat-num">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Record</span>
          <span id="best-value" class="stat-num">0</span>
        </div>
      </div>
    </header>

    <section class="controls-bar" aria-label="Paramètres de partie">
      <div class="difficulty-control">
        <span class="control-label">Difficulté</span>
        <div class="difficulty-group" role="group" aria-label="Choix de la difficulté">
          <button class="diff-btn active" data-level="Facile">FACILE</button>
          <button class="diff-btn" data-level="Moyen">MOYEN</button>
          <button class="diff-btn" data-level="Avancé">AVANCÉ</button>
        </div>
      </div>

      <div class="actions-group">
        <button id="sound-toggle" class="icon-btn" title="Activer ou couper le son" aria-label="Son">SFX: ON</button>
        <button id="new-round-btn" class="primary-btn">NOUVEAU DUEL</button>
      </div>
    </section>

    <main id="game-arena" aria-labelledby="duel-question">
      <h2 id="duel-question" class="prompt-banner">Lequel est <span>le plus ancien&nbsp;?</span></h2>

      <div id="error-banner" class="error-banner hidden" role="alert">
        <div class="error-header">
          <span id="error-code" class="error-code">ERREUR</span>
          <strong id="error-title">Un problème est survenu</strong>
        </div>
        <p id="error-message"></p>
        <p id="error-hint" class="error-hint"></p>
        <button id="retry-btn" class="retry-btn">RÉESSAYER</button>
      </div>

      <div id="loader" class="loader-box hidden" role="status">
        <div class="pixel-spinner" aria-hidden="true"></div>
        <p id="loader-text">PRÉPARATION DU DUEL…</p>
      </div>

      <div id="cards-grid" class="cards-grid hidden">
        <article id="card-0" class="wiki-card" tabindex="0" role="button" aria-labelledby="choose-0 title-0">
          <div class="card-tag"><span class="card-letter">A</span> Candidat</div>
          <div class="card-img-wrapper">
            <img id="img-0" alt="" />
            <div id="img-fallback-0" class="img-fallback hidden">Image indisponible</div>
          </div>
          <div class="card-body">
            <h3 id="title-0" class="card-title"></h3>
            <p id="desc-0" class="card-desc"></p>
            <span id="choose-0" class="card-action">Choisir A</span>
          </div>
          <div id="reveal-0" class="card-reveal hidden">
            <span id="year-0" class="reveal-year"></span>
            <a id="link-0" href="#" target="_blank" rel="noopener noreferrer" class="wiki-link">Wikipédia <span aria-hidden="true">↗</span></a>
          </div>
        </article>

        <div class="vs-badge" aria-hidden="true">VS</div>

        <article id="card-1" class="wiki-card" tabindex="0" role="button" aria-labelledby="choose-1 title-1">
          <div class="card-tag"><span class="card-letter">B</span> Candidat</div>
          <div class="card-img-wrapper">
            <img id="img-1" alt="" />
            <div id="img-fallback-1" class="img-fallback hidden">Image indisponible</div>
          </div>
          <div class="card-body">
            <h3 id="title-1" class="card-title"></h3>
            <p id="desc-1" class="card-desc"></p>
            <span id="choose-1" class="card-action">Choisir B</span>
          </div>
          <div id="reveal-1" class="card-reveal hidden">
            <span id="year-1" class="reveal-year"></span>
            <a id="link-1" href="#" target="_blank" rel="noopener noreferrer" class="wiki-link">Wikipédia <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      </div>

      <div id="result-panel" class="result-panel hidden">
        <div class="result-copy" role="status">
          <p id="result-verdict" class="result-verdict"></p>
          <p id="result-detail" class="result-detail"></p>
        </div>
        <button id="next-btn" class="primary-btn">MANCHE SUIVANTE</button>
      </div>
    </main>
  </div>
</body>
</html>
